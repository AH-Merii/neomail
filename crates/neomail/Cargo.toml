[package]
name = "neomail"
description = "neomail, a terminal email client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "neomail"
path = "src/main.rs"

[dependencies]
nm-core.workspace = true
nm-graph.workspace = true
nm-imap.workspace = true
anstyle.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
keyring-core.workspace = true
ring.workspace = true
rpassword.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
terminal_size.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tokio-rustls.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-width.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Paused time for the device code polling tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
