[package]
name = "nm-core"
description = "neomail domain types, the MailSource seam, the SQLite cache and the sync engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Files attached to a message are base64-encoded (crates/nm-core/src/compose.rs). Already in the
# tree through nm-imap and nm-graph.
base64.workspace = true
chrono.workspace = true
html2text.workspace = true
html5ever.workspace = true
mail-builder.workspace = true
mail-parser.workspace = true
pulldown-cmark.workspace = true
rusqlite.workspace = true
# msg_key: the hash of a message without a Message-ID (crates/nm-core/src/parse.rs). Already in
# the tree through neomail.
sha2.workspace = true
serde.workspace = true
# A classification's probabilities, stored as a JSON object (crates/nm-core/src/cache.rs).
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

[lints]
workspace = true

[features]
# `nm_core::conformance`: the contract checks every IdSource implementation runs in its tests.
conformance = []
