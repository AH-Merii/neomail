[workspace]
resolver = "3"
members = ["crates/nmail", "crates/nm-core", "crates/nm-imap"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AH-Merii/neomail"

[workspace.dependencies]
nm-core = { path = "crates/nm-core" }
nm-imap = { path = "crates/nm-imap" }

async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
html2text = "0.17"
# Must match the html5ever that html2text uses: its RcDom is the parse target.
html5ever = "0.40"
mail-parser = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
