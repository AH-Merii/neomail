[workspace]
resolver = "3"
members = ["crates/neomail", "crates/nm-core", "crates/nm-graph", "crates/nm-imap", "crates/nm-redact"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AH-Merii/neomail"

[workspace.dependencies]
nm-core = { path = "crates/nm-core" }
nm-graph = { path = "crates/nm-graph" }
nm-imap = { path = "crates/nm-imap" }
nm-redact = { path = "crates/nm-redact" }

async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
anstyle = "1"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
# The setup wizards' terminal (crates/neomail/src/wizard/term.rs): raw mode, keys and the size.
# ratatui's default backend, so the TUI can share it; no bracketed paste or Windows parts.
crossterm = { version = "0.29", default-features = false, features = ["events"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
html2text = "0.17"
# Must match the html5ever that html2text uses: its RcDom is the parse target.
html5ever = "0.40"
# The OS keyring: keyring-core's API, plus one store per platform (crates/neomail/src/keyring.rs).
keyring-core = { version = "1", default-features = false }
apple-native-keyring-store = { version = "1.0.2", default-features = false, features = ["keychain"] }
# Pure-Rust D-Bus (zbus) rather than libdbus, so the static musl build keeps linking. Its blocking
# calls run on a tokio runtime of its own; neomail reads passwords before entering its own runtime.
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["rt-tokio-crypto-rust"] }
# Desktop notifications from `neomail daemon` (Linux). The version the keyring store already brings
# in, on tokio as there, so no crate or feature enters the tree.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
mail-parser = "0.11"
# Builds outgoing mail (crates/nm-core/src/compose.rs): RFC 2047 words, folding and the part
# encodings. From mail-parser's authors; without gethostname, as compose sets the Message-ID.
mail-builder = { version = "1.0", default-features = false }
# Renders a draft's Markdown to the HTML part (crates/nm-core/src/compose.rs). Only the HTML
# renderer: no getopts.
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rpassword = "7.5"
# The redaction rules (crates/nm-redact): every pattern is compiled once, and its linear-time
# matching keeps a 1,500-character excerpt cheap.
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# flock(2) for the daemon and account locks (crates/neomail/src/lock.rs): std's File::lock needs
# Rust 1.89. Already in the tree through terminal_size.
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
# Holds Ctrl-C off while the pager runs (crates/neomail/src/pager.rs); its safe API avoids `unsafe`.
signal-hook = { version = "0.4", default-features = false }
tempfile = "3"
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
unicode-segmentation = "1.12"
unicode-width = "0.2"
anyhow = "1"
base64 = "0.23"
ring = { version = "0.17", default-features = false }
# Tests only: a self-signed certificate for the fake SMTP server on 127.0.0.1 (crates/nm-imap).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
