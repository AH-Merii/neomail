name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch or PR; a newer push cancels the older run, so only the newest main build
# publishes edge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Linux first (DEC-2026-10-12-linux-first): a macOS failure shows on its own job, but the run
    # stays green and the jobs that need this one still run.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # --all-features also builds nm-core's `conformance` checks and runs their tests.
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked --all-features

  # install.sh runs under any POSIX sh, so shellcheck checks it as sh (its shebang).
  shellcheck:
    name: Shellcheck install.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Preinstalled on the Ubuntu 24.04 image; installed here if a newer image drops it.
      - run: command -v shellcheck || { sudo apt-get update && sudo apt-get install -y shellcheck; }
      - run: shellcheck install.sh

  # The oldest Rust that Cargo.toml's rust-version claims. Keep the two in step.
  msrv:
    name: Check on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets --all-features

  # Runs on pull requests too, so a dependency that breaks the static musl link fails before it
  # merges. The macOS build may fail without blocking anything (Linux first), and a failing leg
  # with continue-on-error does not cancel the other. The macOS build is published even when the
  # macOS check failed: edge only, Linux first. Only publish-edge, on main, uploads to the release.
  build-edge:
    name: Build edge (${{ matrix.target }})
    needs: [check, msrv]
    strategy:
      matrix:
        include:
          # musl: a static binary that runs on any x86_64 Linux, whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl C toolchain (ring and the bundled SQLite are C)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p neomail
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The licence notices of the statically linked crates; about.toml lists the accepted ones.
      - run: cargo about generate --locked --fail -c about.toml -m crates/neomail/Cargo.toml --target ${{ matrix.target }} -o THIRD-PARTY-LICENSES about.hbs
      # The musl target also links musl libc statically (MIT, some files BSD, ISC or public domain);
      # cargo-about only sees crates. With crt-static, rustc links the musl that ships with the
      # toolchain (lib/rustlib/<target>/lib/self-contained), not Ubuntu's: musl-tools only
      # compiles the C code. Rust 1.93 and later bundle musl 1.2.5
      # (https://blog.rust-lang.org/2025/12/05/Updating-musl-1.2.5/), whose COPYRIGHT file is in
      # licenses/; update it when Rust moves to another musl.
      - name: Add the musl libc notice
        if: endsWith(matrix.target, '-musl')
        run: |
          sep='================================================================================'
          dash='--------------------------------------------------------------------------------'
          {
            printf '\n%s\nmusl libc 1.2.5 (MIT; some files under other permissive terms, listed below)\n' "$sep"
            printf 'Used by: the Linux (musl) build, statically linked\n%s\n\n' "$dash"
            cat licenses/musl-1.2.5-COPYRIGHT
          } >> THIRD-PARTY-LICENSES
      # The Rust standard library (std, core, alloc and the crates they use) is linked too, under
      # several licences (Unicode-3.0 for core's Unicode tables among them). The toolchain's
      # `rustc` component ships its notices as share/doc/rust/COPYRIGHT-library.html.
      - name: Package
        run: |
          name="neomail-${{ matrix.target }}"
          mkdir "$name"
          std_notice="$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html"
          test -s "$std_notice"
          cp "target/${{ matrix.target }}/release/neomail" README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES "$std_notice" "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: neomail-${{ matrix.target }}
          path: neomail-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish-edge:
    name: Publish edge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-edge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-edge
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # download-artifact succeeds with whatever exists, so check that the Linux build is there.
      # The macOS one may be missing after an allowed failure; the loop below then drops its old
      # asset rather than leave it frozen at an older commit.
      - name: Require the Linux build
        run: test -s dist/neomail-x86_64-unknown-linux-musl.tar.gz
      # install.sh and mise check the tarballs against this file. It is written into dist/ so the
      # loop below, which drops assets that are not in dist/, keeps it.
      - name: Write SHA256SUMS
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS && cat SHA256SUMS
      # A newer push can cancel this job at any step. Once the release exists the tag moves
      # last, so it never runs ahead of the uploaded assets. A cancel during the upload can still
      # leave a tarball missing until the next publishing run, because --clobber deletes the old
      # asset before it uploads the new one. The first publish lets `gh release create` make a
      # draft, upload, then publish, which creates the tag at --target (`gh release create
      # --help`). A cancel leaves a draft without a tag, which `gh release view` still finds, so
      # the next run takes the first branch, where --draft=false publishes it at --target.
      # --target is ignored for a tag that already exists, so a tag without a release goes first.
      - name: Publish the edge pre-release
        # bash -eo pipefail, so a failing `gh release view` in the asset loop fails the step.
        shell: bash
        run: |
          notes="Rolling build of main at ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%MZ)). Replaced on every push to main; expect breaking changes."
          if [ ! -e dist/neomail-aarch64-apple-darwin.tar.gz ]; then
            notes="$notes No macOS build for this commit: it failed, which does not block Linux (Linux first)."
            echo "::warning::the macOS edge build is missing; publishing Linux only"
          fi
          # Only "release not found" means a first publish; any other error (an API hiccup) must
          # not reach the else branch, which deletes the edge tag.
          if view_err=$(gh release view edge 2>&1 >/dev/null); then
            gh release upload edge dist/*.tar.gz dist/SHA256SUMS --clobber
            # --clobber only replaces assets of the same name, so drop any this build did not
            # produce (such as a renamed target), or they would linger frozen at an old commit.
            gh release view edge --json assets --jq '.assets[].name' | while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset edge "$asset" --yes
            done
            gh release edit edge --draft=false --target "$GITHUB_SHA" --prerelease --title "edge" \
              --notes "$notes"
            git tag -f edge "$GITHUB_SHA"
            git push -f origin refs/tags/edge
          elif [ "$view_err" = "release not found" ]; then
            if git ls-remote --exit-code origin refs/tags/edge >/dev/null; then
              git push origin :refs/tags/edge
            fi
            gh release create edge dist/*.tar.gz dist/SHA256SUMS --prerelease --title "edge" --notes "$notes" \
              --target "$GITHUB_SHA"
          else
            echo "::error::cannot read the edge release: $view_err"
            exit 1
          fi

  # install.sh against the edge that publish-edge just uploaded, on a fresh container of each
  # distribution: a full install, then half of the script piped into sh, which must install
  # nothing (all of its code runs from main on the last line).
  install-edge:
    name: Install edge (${{ matrix.image }})
    needs: publish-edge
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The images lack what a desktop has; Alpine keeps BusyBox wget to test that path.
          - image: ubuntu:latest
            setup: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
          - image: alpine:latest
            setup: "true"
          - image: fedora:latest
            setup: dnf install -y tar gzip
          - image: archlinux:latest
            setup: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install and run neomail
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
        run: |
          docker run --rm -e SETUP -v "$PWD:/src:ro" -w /src "$IMAGE" sh -euc '
            sh -c "$SETUP"
            half=$(( $(wc -c < install.sh) / 2 ))
            head -c "$half" install.sh | NEOMAIL_INSTALL_DIR=/opt/truncated sh || true
            if [ -e /opt/truncated ]; then
              echo "half of install.sh changed something"; exit 1
            fi
            sh < install.sh
            export PATH="$HOME/.local/bin:$PATH"
            neomail --version | grep "^neomail "
          '
