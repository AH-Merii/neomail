name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch or PR; a newer push cancels the older run, so only the newest main build
# publishes edge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build-edge:
    name: Build edge (${{ matrix.target }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p nmail
      - name: Package
        run: |
          name="nmail-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/nmail" README.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: nmail-${{ matrix.target }}
          path: nmail-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish-edge:
    name: Publish edge
    needs: build-edge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-edge
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Move the edge tag to this commit
        run: |
          git tag -f edge "$GITHUB_SHA"
          git push -f origin refs/tags/edge
      - name: Create or update the edge pre-release
        run: |
          notes="Rolling build of main at ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%MZ)). Replaced on every push to main; expect breaking changes."
          if gh release view edge >/dev/null 2>&1; then
            gh release edit edge --prerelease --title "edge" --notes "$notes"
          else
            gh release create edge --prerelease --title "edge" --notes "$notes" --verify-tag
          fi
          gh release upload edge dist/*.tar.gz --clobber
