name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch or PR; a newer push cancels the older run, so only the newest main build
# publishes edge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Linux first (DEC-2026-10-12-linux-first): a macOS failure shows on its own job, but the run
    # stays green and the jobs that need this one still run.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  # The oldest Rust that Cargo.toml's rust-version claims. Keep the two in step.
  msrv:
    name: Check on Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  # Runs on pull requests too, so a dependency that breaks the static musl link fails before it
  # merges. The macOS build may fail without blocking anything (Linux first), and a failing leg
  # with continue-on-error does not cancel the other. The macOS build is published even when the
  # macOS check failed: edge only, Linux first. Only publish-edge, on main, uploads to the release.
  build-edge:
    name: Build edge (${{ matrix.target }})
    needs: [check, msrv]
    strategy:
      matrix:
        include:
          # musl: a static binary that runs on any x86_64 Linux, whatever its glibc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl C toolchain (ring and the bundled SQLite are C)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p nmail
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      # The licence notices of the statically linked crates; about.toml lists the accepted ones.
      - run: cargo about generate --locked --fail -c about.toml -m crates/nmail/Cargo.toml --target ${{ matrix.target }} -o THIRD-PARTY-LICENSES about.hbs
      # The musl target also links musl libc statically (MIT, some files BSD, ISC or public domain);
      # cargo-about only sees crates. The Ubuntu musl package that musl-tools installs carries
      # musl's full notice; `test -s` fails the build if it ever goes missing.
      - name: Add the musl libc notice
        if: endsWith(matrix.target, '-musl')
        run: |
          test -s /usr/share/doc/musl/copyright
          sep='================================================================================'
          dash='--------------------------------------------------------------------------------'
          {
            printf '\n%s\nmusl libc (MIT; some files under other permissive terms, listed below)\n' "$sep"
            printf 'Used by: the Linux (musl) build, statically linked\n%s\n\n' "$dash"
            cat /usr/share/doc/musl/copyright
          } >> THIRD-PARTY-LICENSES
      - name: Package
        run: |
          name="nmail-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/nmail" README.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-LICENSES "$name/"
          tar -czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: nmail-${{ matrix.target }}
          path: nmail-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  publish-edge:
    name: Publish edge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-edge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-edge
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # download-artifact succeeds with whatever exists, so check that the Linux build is there.
      # The macOS one may be missing after an allowed failure; the loop below then drops its old
      # asset rather than leave it frozen at an older commit.
      - name: Require the Linux build
        run: test -s dist/nmail-x86_64-unknown-linux-musl.tar.gz
      # A newer push can cancel this job at any step. Once the release exists the tag moves
      # last, so it never runs ahead of the uploaded assets. A cancel during the upload can still
      # leave a tarball missing until the next publishing run, because --clobber deletes the old
      # asset before it uploads the new one. The first publish must push the tag before creating
      # the release; if it is cancelled, the next run takes whichever branch applies.
      - name: Publish the edge pre-release
        # bash -eo pipefail, so a failing `gh release view` in the asset loop fails the step.
        shell: bash
        run: |
          notes="Rolling build of main at ${GITHUB_SHA} ($(date -u +%Y-%m-%dT%H:%MZ)). Replaced on every push to main; expect breaking changes."
          if [ ! -e dist/nmail-aarch64-apple-darwin.tar.gz ]; then
            notes="$notes No macOS build for this commit: it failed, which does not block Linux (Linux first)."
            echo "::warning::the macOS edge build is missing; publishing Linux only"
          fi
          if gh release view edge >/dev/null 2>&1; then
            gh release upload edge dist/*.tar.gz --clobber
            # --clobber only replaces assets of the same name, so drop any this build did not
            # produce (such as a renamed target), or they would linger frozen at an old commit.
            gh release view edge --json assets --jq '.assets[].name' | while read -r asset; do
              [ -e "dist/$asset" ] || gh release delete-asset edge "$asset" --yes
            done
            gh release edit edge --prerelease --title "edge" --notes "$notes"
            git tag -f edge "$GITHUB_SHA"
            git push -f origin refs/tags/edge
          else
            git tag -f edge "$GITHUB_SHA"
            git push -f origin refs/tags/edge
            gh release create edge --prerelease --title "edge" --notes "$notes" --verify-tag
            gh release upload edge dist/*.tar.gz --clobber
          fi
